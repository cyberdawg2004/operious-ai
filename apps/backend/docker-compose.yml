name: operious-ai

services:
  postgres:
    image: postgres:16
    container_name: operious-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-operious}
      POSTGRES_USER: ${POSTGRES_USER:-operious}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operious}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-operious} -d ${POSTGRES_DB:-operious}
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - operious

  redis:
    image: redis:7-alpine
    container_name: operious-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - operious

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operious-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Override host-oriented defaults so the container talks to the
      # other services over the compose network.
      # Auth0
      # These are the credentials for the Auth0 tenant that the API will use to authenticate users.
      # We store these in the environment variables for the API container.
      AUTH0_DOMAIN: ${operious-dev.uk.auth0.com} 
      # PostgreSQL  
      # These are the credentials for the PostgreSQL database that the API will use to store data.
      # We store these in the environment variables for the API container.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Redis
      # These are the credentials for the Redis database that the API will use to store data.
      # We store these in the environment variables for the API container.
      REDIS_HOST: redis
      REDIS_PORT: 6379  
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    networks:
      - operious

volumes:
  postgres_data:
  redis_data:

networks:
  operious:
    driver: bridge
