app = "operious-ai-imad"

primary_region = "sin"

[build]

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "celery -A app.workers.celery_app worker --loglevel=info"

[env]
  PORT = "8000"
  ENVIRONMENT = "staging"
  AUTH_ENABLED = "true"
  AUTH_PROVIDER = "auth0"
  AUTH0_DOMAIN = "operious-dev.uk.auth0.com"
  AUTH0_ISSUER = "https://operious-dev.uk.auth0.com/"
  AUTH0_AUDIENCE = "https://api.operious.ai"
  AUTH0_JWKS_URL = "https://operious-dev.uk.auth0.com/.well-known/jwks.json"
  CORS_ALLOW_ORIGINS = "https://app.operious.com,https://www.operious.com,https://operious.com,http://localhost:3000,https://operious-ai-command-center.vercel.app"
  CORS_ALLOW_CREDENTIALS = "true"
  CORS_ALLOW_METHODS = "GET,POST,PATCH,DELETE,OPTIONS"
  CORS_ALLOW_HEADERS = "Authorization,Content-Type,X-Request-ID,x-operious-client-request-id,x-operious-correlation-id"
  SENTRY_TRACES_SAMPLE_RATE = "0.1"
  SENTRY_PROFILES_SAMPLE_RATE = "0.0"
  SENTRY_SEND_DEFAULT_PII = "false"

[http_service]
  internal_port = 8000
  processes = ["app"]
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
