app = "operious-ai-imad"

primary_region = "iad"

[build]

[deploy]
  # Runs ONCE per deploy, in a one-off release machine, before any process
  # group's machines are replaced -- Fly aborts the entire deploy (no
  # machines updated) if this exits non-zero, so a bad migration fails
  # closed instead of half-applying across a rolling deploy. Picks up
  # ALEMBIC_DATABASE_URL (the owner role that can run DDL) over the
  # restricted-RLS DATABASE_URL the app uses at runtime --
  # migrations/env.py already prefers it when set (see
  # apps/backend/migrations/env.py). Closes the orphaned-probe window
  # between deploy-live and a manual `alembic upgrade head` (hit with 0092).
  release_command = "alembic upgrade head"

# Pilot scaling: manually invoke `fly scale count N --process-group <name>
# --app operious-ai-imad` to scale within the bounds below.
# See docs/runbooks/autoscaling.md for thresholds.

[processes]
  web = "scripts/prepare_google_credentials.sh uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker_diagnostic = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app worker --loglevel=info -Q diagnostic.high,diagnostic.normal,diagnostic.retry --concurrency=4 --without-gossip --without-mingle --without-heartbeat"
  worker_escalation = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app worker --loglevel=info -Q escalation --concurrency=1 --without-gossip --without-mingle --without-heartbeat"
  worker_supervisor = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app worker --loglevel=info -Q supervisor,qa --concurrency=1 --without-gossip --without-mingle --without-heartbeat"
  worker_sme_approval = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app worker --loglevel=info -Q sme_approval --concurrency=1 --without-gossip --without-mingle --without-heartbeat"
  worker_sop = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app worker --loglevel=info -Q sop_intelligence,knowledge_indexing --concurrency=1 --without-gossip --without-mingle --without-heartbeat"
  worker_maintenance = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app worker --loglevel=info -Q webhook_maintenance,dead_letter --concurrency=1 --without-gossip --without-mingle --without-heartbeat"
  worker_beat = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule"
  worker_ingress = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app worker --loglevel=info -Q ingress.email,ingress.whatsapp,ingress.shopify,whatsapp_media_fetch --concurrency=2 --without-gossip --without-mingle --without-heartbeat"
  worker_outbound_send = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app worker --loglevel=info -Q outbound.send --concurrency=1 --without-gossip --without-mingle --without-heartbeat"
  worker_voice_realtime = "scripts/prepare_google_credentials.sh env DB_USE_NULLPOOL=true celery -A app.workers.celery_app worker --queues ingress.voice --concurrency=2 --loglevel=info --without-gossip --without-mingle --without-heartbeat"

[env]
  # AUDIT_EXPORT_HMAC_SECRET is set through `fly secrets set`, never [env].
  # TENANT_CREDENTIAL_MASTER_KEY is set through `fly secrets set` as well.
  PORT = "8000"
  ENVIRONMENT = "production"
  # Trusted-ingress allowlist (S-01). On Fly, the edge proxy forwards
  # public traffic to the app over the private 6PN network, so the app
  # observes the proxy as an ``fdaa::/16`` peer. Only authority-bearing
  # requests forwarded by this proxy are accepted; a direct caller (or a
  # spoofed ``X-Tenant-ID``) is rejected. Anonymous health checks carry
  # no authority headers and pass regardless.
  #
  # OPERATOR ACTION: verify this range against your deployment. If
  # authenticated requests start returning ``400 untrusted_ingress``,
  # read the logged ``peer`` field (app logs ``untrusted_ingress_rejected``
  # with the real source IP) and widen TRUSTED_PROXIES to match. Getting
  # this wrong fails CLOSED (rejects auth), never open.
  TRUSTED_PROXIES = "fdaa::/16"
  AUTH_ENABLED = "true"
  AUTH_PROVIDER = "auth0"
  AUTH0_DOMAIN = "operious-dev.uk.auth0.com"
  AUTH0_ISSUER = "https://operious-dev.uk.auth0.com/"
  AUTH0_AUDIENCE = "https://api.operious.ai"
  AUTH0_JWKS_URL = "https://operious-dev.uk.auth0.com/.well-known/jwks.json"
  CORS_ALLOW_ORIGINS = "https://app.operious.com,https://www.operious.com,https://operious.com,http://localhost:3000,https://operious-ai-command-center.vercel.app,https://platform.operious.com"
  CORS_ALLOW_CREDENTIALS = "true"
  CORS_ALLOW_METHODS = "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOW_HEADERS = "Authorization,Content-Type,X-Request-ID,x-operious-client-request-id,x-operious-correlation-id"
  SENTRY_TRACES_SAMPLE_RATE = "0.1"
  SENTRY_PROFILES_SAMPLE_RATE = "0.0"
  SENTRY_SEND_DEFAULT_PII = "false"

[http_service]
  # Voice capacity: web machines host WebSocket calls.
  # web machines x VOICE_CAPACITY_LIMIT = total voice capacity.
  # At 100 calls per web machine, 2 web machines = 200 active calls.
  # Scale web machines to scale realtime voice capacity.
  internal_port = 8000
  processes = ["web"]
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/live"

[[vm]]
  processes = ["web"]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
  min_machines_running = 1
  max_machines_running = 2

[[vm]]
  processes = ["worker_diagnostic"]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 2
  min_machines_running = 1
  max_machines_running = 3

