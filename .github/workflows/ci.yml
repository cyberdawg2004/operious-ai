name: CI

on:
  push:
    branches: [main, phase-2-2-stabilized]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: operious
          POSTGRES_PASSWORD: operious
          POSTGRES_DB: operious_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U operious -d operious_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: operious
      POSTGRES_PASSWORD: operious
      POSTGRES_DB: operious_test
      DATABASE_URL: postgresql+asyncpg://operious:operious@localhost:5432/operious_test
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://operious:operious@localhost:5432/operious_test
      TEST_DATABASE_URL: postgresql+asyncpg://operious:operious@localhost:5432/operious_test
      TENANT_CREDENTIAL_MASTER_KEY: ci-data-protection-master-key-32-bytes-minimum
      LOAD_SEED_STOP_THRESHOLD_SECONDS: "180"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install ruff
      - name: Lint (ruff)
        working-directory: apps/backend
        run: ruff check app tests scripts
      - name: Prepare Postgres test role
        run: |
          python - <<'PY'
          import psycopg2

          connection = psycopg2.connect(
              host="localhost",
              port=5432,
              dbname="operious_test",
              user="operious",
              password="operious",
          )
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute(
                  """
                  DO $$
                  BEGIN
                      CREATE ROLE operious_app_test NOLOGIN;
                  EXCEPTION WHEN duplicate_object THEN
                      NULL;
                  END
                  $$;
                  """
              )
              cursor.execute("GRANT operious_app_test TO operious")
          connection.close()
          PY
      - name: Apply migrations
        run: alembic upgrade head
      - name: Grant Postgres test role table access
        run: |
          python - <<'PY'
          import psycopg2

          connection = psycopg2.connect(
              host="localhost",
              port=5432,
              dbname="operious_test",
              user="operious",
              password="operious",
          )
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("GRANT USAGE ON SCHEMA public TO operious_app_test")
              cursor.execute(
                  """
                  GRANT SELECT, INSERT, UPDATE, DELETE
                  ON ALL TABLES IN SCHEMA public
                  TO operious_app_test
                  """
              )
              cursor.execute(
                  """
                  GRANT USAGE, SELECT
                  ON ALL SEQUENCES IN SCHEMA public
                  TO operious_app_test
                  """
              )
          connection.close()
          PY
      - name: Tests (incl. Postgres-backed RLS + integration)
        run: python -m pytest -q

  frontend-invariants:
    name: Frontend architectural invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Run invariant tests
        run: npm run test:frontend
