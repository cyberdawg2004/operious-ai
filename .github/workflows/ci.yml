name: CI

on:
  push:
    branches: [main, phase-2-2-stabilized]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: operious
          POSTGRES_PASSWORD: operious
          POSTGRES_DB: operious_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U operious -d operious_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: operious
      POSTGRES_PASSWORD: operious
      POSTGRES_DB: operious_test
      DATABASE_URL: postgresql+asyncpg://operious:operious@localhost:5432/operious_test
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://operious:operious@localhost:5432/operious_test
      TEST_DATABASE_URL: postgresql+asyncpg://operious:operious@localhost:5432/operious_test
      TENANT_CREDENTIAL_MASTER_KEY: ci-data-protection-master-key-32-bytes-minimum
      LOAD_SEED_STOP_THRESHOLD_SECONDS: "180"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      ATTACHMENTS_S3_BUCKET: ${{ secrets.ATTACHMENTS_S3_BUCKET }}
      ATTACHMENTS_S3_REGION: ${{ secrets.ATTACHMENTS_S3_REGION }}
      ATTACHMENTS_S3_ACCESS_KEY_ID: ${{ secrets.ATTACHMENTS_S3_ACCESS_KEY_ID }}
      ATTACHMENTS_S3_SECRET_ACCESS_KEY: ${{ secrets.ATTACHMENTS_S3_SECRET_ACCESS_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Not a secret. config.py's default is now the live model id too —
      # this override is redundant belt-and-suspenders, kept so CI still
      # pins explicitly rather than relying solely on the code default.
      ANTHROPIC_DEFAULT_MODEL: claude-sonnet-4-6
      SKIP_LIVE_CONNECTOR_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install ruff pip-audit cyclonedx-bom
      - name: Generate backend SBOM
        run: cyclonedx-py requirements apps/backend/requirements.txt --of JSON -o backend-sbom.cdx.json
      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.cdx.json
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r apps/backend/requirements.txt --no-deps --disable-pip --format json --output pip-audit-report.json
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
      - name: Dependency license audit (pip-licenses)
        run: |
          pip install pip-licenses
          pip-licenses --format=json --output-file backend-licenses.json
          # Fail closed on SaaS-incompatible network/strong copyleft. Weak
          # copyleft (LGPL/MPL) is permitted for a hosted service.
          pip-licenses --fail-on "GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;GNU General Public License v3 or later (GPLv3+);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 or later (AGPLv3+);GNU Affero General Public License v3 (AGPLv3)"
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-licenses
          path: backend-licenses.json
      - name: Lint (ruff)
        working-directory: apps/backend
        run: ruff check app tests scripts
      - name: Prepare Postgres test role
        run: |
          python - <<'PY'
          import psycopg2

          connection = psycopg2.connect(
              host="localhost",
              port=5432,
              dbname="operious_test",
              user="operious",
              password="operious",
          )
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute(
                  """
                  DO $$
                  BEGIN
                      CREATE ROLE operious_app_test NOLOGIN;
                  EXCEPTION WHEN duplicate_object THEN
                      NULL;
                  END
                  $$;
                  """
              )
              cursor.execute("GRANT operious_app_test TO operious")
          connection.close()
          PY
      - name: Apply migrations
        run: alembic upgrade head
      - name: Grant Postgres test role table access
        run: |
          python - <<'PY'
          import psycopg2

          connection = psycopg2.connect(
              host="localhost",
              port=5432,
              dbname="operious_test",
              user="operious",
              password="operious",
          )
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("GRANT USAGE ON SCHEMA public TO operious_app_test")
              cursor.execute(
                  """
                  GRANT SELECT, INSERT, UPDATE, DELETE
                  ON ALL TABLES IN SCHEMA public
                  TO operious_app_test
                  """
              )
              cursor.execute(
                  """
                  GRANT USAGE, SELECT
                  ON ALL SEQUENCES IN SCHEMA public
                  TO operious_app_test
                  """
              )
          connection.close()
          PY
      - name: DNS rebinding determinism proof
        run: |
          for i in 1 2 3; do
            python -m pytest -q apps/backend/tests/test_ssrf_dns_rebinding.py
          done
      - name: Tests (incl. Postgres-backed RLS + integration)
        run: python -m pytest -q

  rls-restricted-role:
    name: Backend restricted-role RLS sentinels
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: operious
          POSTGRES_PASSWORD: operious
          POSTGRES_DB: operious_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U operious -d operious_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: operious
      POSTGRES_PASSWORD: operious
      POSTGRES_DB: operious_test
      DATABASE_URL: postgresql+asyncpg://operious:operious@localhost:5432/operious_test
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://operious:operious@localhost:5432/operious_test
      TEST_DATABASE_URL: postgresql+asyncpg://operious:operious@localhost:5432/operious_test
      RLS_RESTRICTED_ROLE_REQUIRED: "1"
      TENANT_CREDENTIAL_MASTER_KEY: ci-data-protection-master-key-32-bytes-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
      - name: Prepare restricted RLS role
        run: |
          python - <<'PY'
          import psycopg2

          connection = psycopg2.connect(
              host="localhost",
              port=5432,
              dbname="operious_test",
              user="operious",
              password="operious",
          )
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute(
                  """
                  DO $$
                  BEGIN
                      CREATE ROLE operious_app_test NOLOGIN;
                  EXCEPTION WHEN duplicate_object THEN
                      NULL;
                  END
                  $$;
                  """
              )
              cursor.execute("GRANT operious_app_test TO operious")
          connection.close()
          PY
      - name: Apply migrations as owner
        run: alembic upgrade head
      - name: Grant restricted role table access
        run: |
          python - <<'PY'
          import psycopg2

          connection = psycopg2.connect(
              host="localhost",
              port=5432,
              dbname="operious_test",
              user="operious",
              password="operious",
          )
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("GRANT USAGE ON SCHEMA public TO operious_app_test")
              cursor.execute(
                  """
                  GRANT SELECT, INSERT, UPDATE, DELETE
                  ON ALL TABLES IN SCHEMA public
                  TO operious_app_test
                  """
              )
              cursor.execute(
                  """
                  GRANT USAGE, SELECT
                  ON ALL SEQUENCES IN SCHEMA public
                  TO operious_app_test
                  """
              )
          connection.close()
          PY
      - name: Restricted-role RLS filtering tests
        run: python -m pytest -q apps/backend/tests/test_rls_restricted_role_ci.py

  frontend-invariants:
    name: Frontend architectural invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Run invariant tests
        run: npm run test:frontend

  dependency-review:
    name: Dependency review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
